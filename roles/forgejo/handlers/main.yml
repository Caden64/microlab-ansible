---
- name: Validate sshd configuration
  ansible.builtin.command:
    argv:
      - sshd
      - -t
  changed_when: false

- name: Reload ssh
  ansible.builtin.systemd:
    name: "{{ micolab_forgejo_sshd_service }}"
    state: reloaded

- name: Restart forgejo
  ansible.builtin.systemd:
    name: "{{ micolab_forgejo_service_name }}"
    state: restarted
    daemon_reload: true
