---
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Technitium TLS renewal timer
  ansible.builtin.systemd_service:
    name: "{{ microlab_technitium_timer_unit }}"
    state: restarted
    daemon_reload: true
  when: microlab_technitium_timer_active | default(false) | bool
