---
- name: Read current Technitium settings
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/settings/get"
    method: GET
    headers:
      Authorization: "Bearer {{ micolab_technitium_token }}"
    status_code: 200
    return_content: true
    timeout: 15
  register: micolab_dns_settings_current
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Require settings read access
  ansible.builtin.assert:
    that:
      - micolab_dns_settings_current.status | default(0) == 200
      - (micolab_dns_settings_current.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      Unable to read Technitium settings over loopback. The bearer session may
      have expired; no settings were changed.
    quiet: true

- name: Extract merge inputs from current settings
  ansible.builtin.set_fact:
    micolab_dns_current_recursion_acl: >-
      {{ micolab_dns_settings_current.json.response.recursionNetworkACL | default([])
         | micolab_acl_normalize }}
    micolab_dns_current_zone_transfer_acl: >-
      {{ micolab_dns_settings_current.json.response.zoneTransferAllowedNetworks | default([])
         | micolab_acl_normalize }}
    micolab_dns_current_forwarders: >-
      {{ ((micolab_dns_settings_current.json.response.forwarders | default([])).split(',')
          if (micolab_dns_settings_current.json.response.forwarders | default([])) is string
          else (micolab_dns_settings_current.json.response.forwarders | default([])))
         | map('trim') | reject('equalto', '') | list }}
    micolab_dns_encrypted_protocol_state:
      enableDnsOverTls: "{{ micolab_dns_settings_current.json.response.enableDnsOverTls | default(false) }}"
      enableDnsOverHttps: "{{ micolab_dns_settings_current.json.response.enableDnsOverHttps | default(false) }}"
      enableDnsOverHttp: "{{ micolab_dns_settings_current.json.response.enableDnsOverHttp | default(false) }}"
      enableDnsOverQuic: "{{ micolab_dns_settings_current.json.response.enableDnsOverQuic | default(false) }}"

- name: Build the explicit recursion and zone-transfer allow sets
  ansible.builtin.set_fact:
    micolab_dns_required_recursion_acl: >-
      {{ (micolab_admin_cidrs
          + micolab_client_cidrs
          + (micolab_admin_cidrs_v6 + micolab_client_cidrs_v6
             if micolab_dns_ipv6_enabled | bool else [])
          + micolab_dns_recursion_allow_cidrs) | micolab_acl_normalize }}
    micolab_dns_required_zone_transfer_acl: >-
      {{ (micolab_admin_cidrs
          + (micolab_admin_cidrs_v6 if micolab_dns_ipv6_enabled | bool else []))
         | micolab_acl_normalize }}

- name: Merge managed entries behind existing ACL entries without reordering
  ansible.builtin.set_fact:
    micolab_dns_recursion_merge: >-
      {{ micolab_dns_current_recursion_acl
         | micolab_acl_merge(micolab_dns_required_recursion_acl) }}
    micolab_dns_zone_transfer_merge: >-
      {{ micolab_dns_current_zone_transfer_acl
         | micolab_acl_merge(micolab_dns_required_zone_transfer_acl) }}
    micolab_dns_merged_recursion_acl: >-
      {{ (micolab_dns_current_recursion_acl
          | micolab_acl_merge(micolab_dns_required_recursion_acl)).entries }}
    micolab_dns_merged_zone_transfer_acl: >-
      {{ (micolab_dns_current_zone_transfer_acl
          | micolab_acl_merge(micolab_dns_required_zone_transfer_acl)).entries }}
    micolab_dns_authoritative_only_networks: >-
      {{ (micolab_dns_authoritative_only_cidrs
          + (micolab_dns_authoritative_only_cidrs_v6
             if micolab_dns_ipv6_enabled | bool else [])) | micolab_acl_normalize }}

- name: Refuse ACLs whose first-match order shadows a managed entry
  ansible.builtin.assert:
    that:
      - micolab_dns_recursion_merge.conflicts | length == 0
      - micolab_dns_zone_transfer_merge.conflicts | length == 0
    fail_msg: >-
      The ordered ACL contains a first-match conflict:
      recursion={{ micolab_dns_recursion_merge.conflicts }},
      zone-transfer={{ micolab_dns_zone_transfer_merge.conflicts }}.
      Technitium uses first-match-wins, so appending an entry behind a broader
      opposite entry would not install the intended policy. Reorder or remove
      the conflicting existing entry first.
    quiet: true

- name: Detect existing recursion allows that cover authoritative-only networks
  ansible.builtin.set_fact:
    micolab_dns_recursion_deny_conflicts: >-
      {{ micolab_dns_merged_recursion_acl
         | micolab_acl_deny_conflicts(micolab_dns_authoritative_only_networks) }}

- name: Refuse recursion ACLs that allow any authoritative-only network
  ansible.builtin.assert:
    that:
      - micolab_dns_recursion_deny_conflicts | length == 0
    fail_msg: >-
      The merged recursion ACL does not effectively deny every
      micolab_dns_authoritative_only_cidrs entry:
      {{ micolab_dns_recursion_deny_conflicts }}. Technitium uses
      first-match-wins, so an existing broad allow (for example 10.0.0.0/8)
      silently makes a narrower authoritative-only network recursive. This
      role preserves unknown ACL entries and will not delete or reorder the
      existing allow. Remove or narrow the reported existing allow, or put an
      explicit covering !deny before it, then rerun.
    quiet: true

- name: Refuse wildcard or loopback-denying recursion ACLs
  ansible.builtin.assert:
    that:
      - micolab_dns_merged_recursion_acl | select('match', '^!?(0\\.0\\.0\\.0/0|::/0)$') | list | length == 0
      - micolab_dns_merged_recursion_acl | select('match', '^!127\\.') | list | length == 0
      - micolab_dns_merged_recursion_acl | select('match', '^!::1$') | list | length == 0
      - micolab_dns_merged_zone_transfer_acl | select('match', '^!?(0\\.0\\.0\\.0/0|::/0)$') | list | length == 0
      - micolab_dns_required_recursion_acl | micolab_acl_unallowed(micolab_dns_merged_recursion_acl) | length == 0
      - micolab_dns_required_zone_transfer_acl | micolab_acl_unallowed(micolab_dns_merged_zone_transfer_acl) | length == 0
    fail_msg: >-
      The merged recursion ACL contains a default route, denies loopback, or
      does not actually allow every required admin/client/recursion network.
      That would either turn this server into an open resolver or break the
      local stub/resolver path. Fix the conflicting ACL entry first.
    quiet: true

- name: Refuse online forwarders unless explicitly opted in
  ansible.builtin.assert:
    that:
      - micolab_dns_current_forwarders | length == 0
    fail_msg: >-
      Technitium already has forwarders configured but
      micolab_dns_allow_online_forwarders is false. Remove the forwarders or
      opt in deliberately; this role will not silently disable or replace
      them.
    quiet: true
  when: not micolab_dns_allow_online_forwarders | bool

- name: Build the desired settings payload
  ansible.builtin.set_fact:
    micolab_dns_settings_desired:
      dnsServerDomain: "{{ micolab_dns_primary_ns }}"
      dnsServerLocalEndPoints: >-
        {{ '0.0.0.0:53,[::]:53'
           if micolab_dns_ipv6_enabled | bool else '0.0.0.0:53' }}
      dnsServerEnableCheckForUpdate: false
      dnsAppsEnableAutomaticUpdate: false
      ipv6Mode: "{{ 'Enabled' if micolab_dns_ipv6_enabled | bool else 'Disabled' }}"
      recursion: UseSpecifiedNetworkACL
      recursionNetworkACL: "{{ micolab_dns_merged_recursion_acl | join(',') }}"
      zoneTransferAllowedNetworks: "{{ micolab_dns_merged_zone_transfer_acl | join(',') }}"
      loggingType: File
      logFolder: "{{ micolab_technitium_log_dir }}"
      maxLogFileDays: "{{ micolab_dns_log_retention_days | int }}"
      maxStatFileDays: "{{ micolab_dns_stats_retention_days | int }}"
      logQueries: "{{ micolab_dns_log_queries | bool }}"
      webServiceLocalAddresses: "{{ micolab_technitium_admin_bind_address }}"
      webServiceHttpPort: "{{ micolab_technitium_admin_port | int }}"
      # Caddy is the only admin reverse proxy. It connects over IPv4
      # loopback and overwrites X-Real-IP, so trust exactly that one address
      # and read exactly that header. This replaces any arbitrary proxy
      # networks; it never merges them.
      webServiceReverseProxyAddresses: "{{ micolab_dns_admin_reverse_proxy_address }}"
      webServiceRealIpHeader: "{{ micolab_dns_admin_real_ip_header }}"

- name: Add explicitly opted-in forwarders to the desired payload
  ansible.builtin.set_fact:
    micolab_dns_settings_desired: >-
      {{ micolab_dns_settings_desired | combine({
           'forwarders': ((micolab_dns_current_forwarders + micolab_dns_forwarders)
                          | unique | join(','))
         }) }}
  when:
    - micolab_dns_allow_online_forwarders | bool
    - micolab_dns_forwarders | length > 0

- name: Normalize current settings for comparison
  ansible.builtin.set_fact:
    micolab_dns_settings_normalized:
      dnsServerDomain: "{{ micolab_dns_settings_current.json.response.dnsServerDomain | default('') }}"
      dnsServerLocalEndPoints: "{{ (micolab_dns_settings_current.json.response.dnsServerLocalEndPoints | default([]))
        if (micolab_dns_settings_current.json.response.dnsServerLocalEndPoints | default([])) is string
        else (micolab_dns_settings_current.json.response.dnsServerLocalEndPoints | default([]) | join(',')) }}"
      dnsServerEnableCheckForUpdate: "{{ micolab_dns_settings_current.json.response.dnsServerEnableCheckForUpdate | default(true) | bool }}"
      dnsAppsEnableAutomaticUpdate: "{{ micolab_dns_settings_current.json.response.dnsAppsEnableAutomaticUpdate | default(true) | bool }}"
      ipv6Mode: "{{ micolab_dns_settings_current.json.response.ipv6Mode | default('Disabled') }}"
      recursion: "{{ micolab_dns_settings_current.json.response.recursion | default('') }}"
      recursionNetworkACL: "{{ micolab_dns_current_recursion_acl | join(',') }}"
      zoneTransferAllowedNetworks: "{{ micolab_dns_current_zone_transfer_acl | join(',') }}"
      loggingType: "{{ micolab_dns_settings_current.json.response.loggingType | default('File') }}"
      logFolder: "{{ micolab_dns_settings_current.json.response.logFolder | default('') }}"
      maxLogFileDays: "{{ micolab_dns_settings_current.json.response.maxLogFileDays | default(0) | int }}"
      maxStatFileDays: "{{ micolab_dns_settings_current.json.response.maxStatFileDays | default(0) | int }}"
      logQueries: "{{ micolab_dns_settings_current.json.response.logQueries | default(false) | bool }}"
      webServiceLocalAddresses: "{{ (micolab_dns_settings_current.json.response.webServiceLocalAddresses | default([]))
        if (micolab_dns_settings_current.json.response.webServiceLocalAddresses | default([])) is string
        else (micolab_dns_settings_current.json.response.webServiceLocalAddresses | default([]) | join(',')) }}"
      webServiceHttpPort: "{{ micolab_dns_settings_current.json.response.webServiceHttpPort | default(0) | int }}"
      webServiceReverseProxyAddresses: >-
        {{ (micolab_dns_settings_current.json.response.webServiceReverseProxyAddresses | default([])
            | micolab_acl_normalize | join(',')) }}
      webServiceRealIpHeader: >-
        {{ micolab_dns_settings_current.json.response.webServiceRealIpHeader | default('') }}
      forwarders: "{{ micolab_dns_current_forwarders | join(',') }}"

- name: Select only settings that differ
  ansible.builtin.set_fact:
    micolab_dns_settings_to_set: {}

- name: Compute the conditional settings mutation
  ansible.builtin.set_fact:
    micolab_dns_settings_to_set: >-
      {{ micolab_dns_settings_to_set | combine({item.key: item.value}) }}
  loop: "{{ micolab_dns_settings_desired | dict2items }}"
  when: micolab_dns_settings_normalized[item.key] | default(None) != item.value

- name: Apply the conditional Technitium settings mutation
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/settings/set"
    method: POST
    headers:
      Authorization: "Bearer {{ micolab_technitium_token }}"
    body_format: form-urlencoded
    body: "{{ micolab_dns_settings_to_set }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: micolab_dns_settings_set
  when: micolab_dns_settings_to_set | length > 0
  failed_when: false
  changed_when: >-
    micolab_dns_settings_set.status | default(0) == 200
    and (micolab_dns_settings_set.json | default({})).status | default('') == 'ok'
  no_log: true
  diff: false
  notify: Technitium DNS restart for persistence gate

- name: Require successful settings mutation
  ansible.builtin.assert:
    that:
      - micolab_dns_settings_set.status | default(0) == 200
      - (micolab_dns_settings_set.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      Technitium rejected the settings update:
      {{ (micolab_dns_settings_set.json | default({})).errorMessage | default('no error message') }}
    quiet: true
  when: micolab_dns_settings_to_set | length > 0

- name: Refresh the bearer session after a settings mutation
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: "{{ micolab_technitium_admin_user }}"
      pass: "{{ micolab_technitium_admin_password }}"
      includeInfo: "true"
    status_code: 200
    return_content: true
    timeout: 15
  register: micolab_dns_settings_relogin
  when: micolab_dns_settings_to_set | length > 0
  until:
    - micolab_dns_settings_relogin.status | default(0) == 200
    - (micolab_dns_settings_relogin.json | default({})).status | default('') == 'ok'
  retries: "{{ micolab_dns_health_retries }}"
  delay: "{{ micolab_dns_health_delay }}"
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Require a fresh session after the settings mutation
  ansible.builtin.assert:
    that:
      - micolab_dns_settings_relogin.status | default(0) == 200
      - (micolab_dns_settings_relogin.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      The loopback API did not accept the vaulted password after the settings
      change. If the web service restarted, retry the role; no zone or record
      mutation has run with a stale token.
    quiet: true
  when: micolab_dns_settings_to_set | length > 0
  no_log: true

- name: Replace the session token after the settings mutation
  ansible.builtin.set_fact:
    micolab_technitium_token: "{{ micolab_dns_settings_relogin.json.token }}"
  when: micolab_dns_settings_to_set | length > 0
  no_log: true

- name: Read back the settings that the health gates depend on
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/settings/get"
    method: GET
    headers:
      Authorization: "Bearer {{ micolab_technitium_token }}"
    status_code: 200
    return_content: true
    timeout: 15
  register: micolab_dns_settings_verified
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Extract the verified settings response
  ansible.builtin.set_fact:
    micolab_dns_verified_response: >-
      {{ (micolab_dns_settings_verified.json | default({})).response | default({}) }}
  no_log: true

- name: Normalize the verified recursion and zone-transfer ACLs
  ansible.builtin.set_fact:
    micolab_dns_verified_acl: >-
      {{ micolab_dns_verified_response.recursionNetworkACL | default([])
         | micolab_acl_normalize }}
    micolab_dns_verified_zone_transfer_acl: >-
      {{ micolab_dns_verified_response.zoneTransferAllowedNetworks | default([])
         | micolab_acl_normalize }}
    micolab_dns_verified_web_addresses: >-
      {{ ((micolab_dns_verified_response.webServiceLocalAddresses | default([])).split(',')
          if (micolab_dns_verified_response.webServiceLocalAddresses | default([])) is string
          else (micolab_dns_verified_response.webServiceLocalAddresses | default([]))) }}
    micolab_dns_verified_reverse_proxies: >-
      {{ micolab_dns_verified_response.webServiceReverseProxyAddresses | default([])
         | micolab_acl_normalize }}
    micolab_dns_verified_real_ip_header: >-
      {{ micolab_dns_verified_response.webServiceRealIpHeader | default('') }}
    micolab_dns_verified_endpoints: >-
      {{ ((micolab_dns_verified_response.dnsServerLocalEndPoints | default([])).split(',')
          if (micolab_dns_verified_response.dnsServerLocalEndPoints | default([])) is string
          else (micolab_dns_verified_response.dnsServerLocalEndPoints | default([]))) }}

- name: Detect recursion allows for authoritative-only networks after readback
  ansible.builtin.set_fact:
    micolab_dns_verified_recursion_deny_conflicts: >-
      {{ micolab_dns_verified_acl
         | micolab_acl_deny_conflicts(micolab_dns_authoritative_only_networks) }}

- name: Gate on the persisted recursion and loopback-admin policy
  ansible.builtin.assert:
    that:
      - micolab_dns_settings_verified.status | default(0) == 200
      - (micolab_dns_settings_verified.json | default({})).status | default('') == 'ok'
      - (micolab_dns_verified_response.recursion | default('')) == 'UseSpecifiedNetworkACL'
      - micolab_dns_required_recursion_acl | micolab_acl_unallowed(micolab_dns_verified_acl) | length == 0
      - micolab_dns_required_zone_transfer_acl | micolab_acl_unallowed(micolab_dns_verified_zone_transfer_acl) | length == 0
      - micolab_dns_verified_acl | micolab_acl_conflicts | length == 0
      - micolab_dns_verified_zone_transfer_acl | micolab_acl_conflicts | length == 0
      - micolab_dns_verified_recursion_deny_conflicts | length == 0
      - micolab_dns_verified_acl | select('match', '^!?(0\\.0\\.0\\.0/0|::/0)$') | list | length == 0
      - micolab_dns_verified_web_addresses | join(',') == micolab_technitium_admin_bind_address
      - micolab_dns_verified_reverse_proxies
        == [micolab_dns_admin_reverse_proxy_address | micolab_canonical_cidr]
      - micolab_dns_verified_real_ip_header | lower == micolab_dns_admin_real_ip_header | lower
      - (micolab_dns_verified_response.dnsServerDomain | default('') | lower) == (micolab_dns_primary_ns | lower)
      - micolab_dns_verified_endpoints | join(',') is search('(^|,)0\\.0\\.0\\.0:53(,|$)')
    fail_msg: >-
      Technitium did not persist the loopback admin binding, the exact Caddy
      reverse-proxy trust ({{ micolab_dns_admin_reverse_proxy_address }} with
      {{ micolab_dns_admin_real_ip_header }}), the recursion ACL, or the
      authoritative server identity. Recursion deny conflicts:
      {{ micolab_dns_verified_recursion_deny_conflicts }}. Refusing to create
      zones with an unknown recursion policy.
    quiet: true

- name: Record that the persisted recursion policy was verified
  ansible.builtin.set_fact:
    micolab_dns_settings_recursion_verified: true
