---
- name: Require the complete loopback service address set
  ansible.builtin.assert:
    that:
      - micolab_dns_addresses is mapping
      - micolab_dns_addresses.keys() | sort == ['ca', 'dns', 'git', 'ns1']
      - micolab_dns_primary_ns == 'ns1.' ~ micolab_domain
      - micolab_dns_zone == (micolab_domain.split('.') | last)
    fail_msg: >-
      micolab_dns_addresses must define exactly ns1, ca, dns, and git; the NS
      target must be ns1.{{ micolab_domain }} and the zone must be the final
      label of {{ micolab_domain }}. Missing addresses are not guessed.
    quiet: true

- name: Require IPv6 addresses when IPv6 is enabled
  ansible.builtin.assert:
    that:
      - micolab_dns_ipv6_addresses.keys() | sort == ['ca', 'dns', 'git', 'ns1']
    fail_msg: >-
      IPv6 is enabled but micolab_dns_ipv6_addresses is incomplete. AAAA
      records are never generated from IPv4 values.
    quiet: true
  when: micolab_dns_ipv6_enabled | bool

- name: Reject AAAA data when IPv6 is disabled
  ansible.builtin.assert:
    that:
      - micolab_dns_ipv6_addresses | length == 0
      - micolab_dns_extra_records | selectattr('type', 'equalto', 'AAAA') | list | length == 0
    fail_msg: >-
      IPv6 is disabled but AAAA addresses or records were supplied. Set
      micolab_dns_ipv6_enabled=true deliberately, with IPv6 firewall ACLs, or
      remove the AAAA data.
    quiet: true
  when: not micolab_dns_ipv6_enabled | bool

- name: Normalize the offline recursion fixture identifiers
  ansible.builtin.set_fact:
    micolab_dns_fixture_zone: >-
      {{ micolab_dns_fixture_zone | lower | regex_replace('[.]$', '') }}
    micolab_dns_fixture_name: >-
      {{ micolab_dns_fixture_name | lower | regex_replace('[.]$', '') }}

- name: Require an explicit offline recursion fixture
  ansible.builtin.assert:
    that:
      - micolab_dns_fixture_upstream is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}:[0-9]{1,5}$')
      - micolab_dns_fixture_zone | length > 0
      - micolab_dns_fixture_name | length > 0
      - micolab_dns_fixture_expected_ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - (micolab_dns_fixture_zone | lower) != (micolab_dns_zone | lower)
      - not ((micolab_dns_fixture_zone | lower) == (micolab_domain | lower)
             or (micolab_dns_fixture_zone | lower).endswith('.' ~ (micolab_domain | lower)))
      - (micolab_dns_fixture_name | lower) == (micolab_dns_fixture_zone | lower)
        or (micolab_dns_fixture_name | lower).endswith('.' ~ (micolab_dns_fixture_zone | lower))
      - micolab_dns_fixture_manage_service | bool
        or micolab_dns_fixture_upstream | length > 0
      - not (micolab_dns_fixture_manage_service | bool)
        or micolab_dns_fixture_upstream
           == (micolab_dns_fixture_listen_address ~ ':' ~ (micolab_dns_fixture_port | string))
    fail_msg: >-
      A cold, WAN-disconnected deployment needs a controlled local recursion
      fixture. Set micolab_dns_fixture_upstream to a reachable local
      IPv4:port, micolab_dns_fixture_zone to a distinct zone (not hnh or a
      subdomain of {{ micolab_domain }}), micolab_dns_fixture_name to a name
      inside that zone, and micolab_dns_fixture_expected_ip to its known A
      answer. When micolab_dns_fixture_manage_service is true the upstream
      must exactly match the managed listen address and port.
    quiet: true

- name: Require the admin proxy trust to match the real Caddy upstream
  ansible.builtin.assert:
    that:
      - micolab_dns_admin_reverse_proxy_address == (micolab_caddy_admin_upstream_host | default('127.0.0.1'))
      - micolab_dns_admin_real_ip_header | lower == 'x-real-ip'
    fail_msg: >-
      Caddy proxies the Technitium admin console from
      {{ micolab_caddy_admin_upstream_host | default('127.0.0.1') }} and
      overwrites X-Real-IP. This role will trust exactly
      {{ micolab_dns_admin_reverse_proxy_address }} with
      {{ micolab_dns_admin_real_ip_header }}. Update the DNS proxy-trust
      variables when the actual Caddy upstream or header changes; never add
      ::1 or arbitrary proxy networks preemptively.
    quiet: true

- name: Extract the recursion fixture endpoint
  ansible.builtin.set_fact:
    micolab_dns_fixture_upstream_host: "{{ micolab_dns_fixture_upstream.rsplit(':', 1)[0] }}"
    micolab_dns_fixture_upstream_port: "{{ micolab_dns_fixture_upstream.rsplit(':', 1)[1] | int }}"
    micolab_dns_fixture_identity:
      upstream: "{{ micolab_dns_fixture_upstream }}"
      zone: "{{ micolab_dns_fixture_zone | lower }}"
      name: "{{ micolab_dns_fixture_name | lower }}"
      expected_ip: "{{ micolab_dns_fixture_expected_ip }}"

- name: Include the controlled offline recursion fixture upstream
  ansible.builtin.include_tasks: fixture_upstream.yml

- name: Include loopback API authentication and password rotation
  ansible.builtin.include_tasks: login.yml

- name: Include settings convergence
  ansible.builtin.include_tasks: settings.yml

- name: Include authoritative zone convergence
  ansible.builtin.include_tasks: zone.yml

- name: Include the conditional-forwarder zone for the recursion fixture
  ansible.builtin.include_tasks: fixture_zone.yml

- name: Include record convergence
  ansible.builtin.include_tasks: records.yml

- name: End the loopback admin session
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/user/logout"
    method: POST
    headers:
      Authorization: "Bearer {{ micolab_technitium_token }}"
    status_code: 200
    return_content: true
  register: micolab_dns_logout
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Restart Technitium now if configuration or records changed
  ansible.builtin.meta: flush_handlers

- name: Wait for the API after a persistence-gate restart
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/status"
    method: GET
    return_content: true
    status_code: 200
  register: micolab_dns_status_after_restart
  until:
    - micolab_dns_status_after_restart.status == 200
    - (micolab_dns_status_after_restart.json | default({})).status | default('') == 'ok'
  retries: "{{ micolab_dns_restart_wait_retries }}"
  delay: "{{ micolab_dns_restart_wait_delay }}"
  changed_when: false
  when: not ansible_check_mode

- name: Re-authenticate after the persistence-gate restart
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: "{{ micolab_technitium_admin_user }}"
      pass: "{{ micolab_technitium_admin_password }}"
      includeInfo: "true"
    status_code: 200
    return_content: true
    timeout: 15
  register: micolab_dns_post_restart_login
  until:
    - micolab_dns_post_restart_login.status | default(0) == 200
    - (micolab_dns_post_restart_login.json | default({})).status | default('') == 'ok'
  retries: "{{ micolab_dns_restart_wait_retries }}"
  delay: "{{ micolab_dns_restart_wait_delay }}"
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Require a working administrator session after restart
  ansible.builtin.assert:
    that:
      - micolab_dns_post_restart_login.status | default(0) == 200
      - (micolab_dns_post_restart_login.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      The vaulted administrator password did not work after restart. The DNS
      configuration is not considered persistent until a fresh login succeeds.
    quiet: true
  no_log: true

- name: Read settings after the persistence-gate restart
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/settings/get"
    method: GET
    headers:
      Authorization: "Bearer {{ micolab_dns_post_restart_login.json.token }}"
    status_code: 200
    return_content: true
    timeout: 15
  register: micolab_dns_post_restart_settings
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Normalize the post-restart admin binding
  ansible.builtin.set_fact:
    micolab_dns_post_restart_web_addresses: >-
      {{ (((micolab_dns_post_restart_settings.json | default({})).response | default({})).webServiceLocalAddresses | default([])
          if (((micolab_dns_post_restart_settings.json | default({})).response | default({})).webServiceLocalAddresses | default([])) is not string
          else [((micolab_dns_post_restart_settings.json | default({})).response | default({})).webServiceLocalAddresses | default('')]) }}
    micolab_dns_post_restart_endpoints: >-
      {{ (((micolab_dns_post_restart_settings.json | default({})).response | default({})).dnsServerLocalEndPoints | default([])
          if (((micolab_dns_post_restart_settings.json | default({})).response | default({})).dnsServerLocalEndPoints | default([])) is not string
          else (((micolab_dns_post_restart_settings.json | default({})).response | default({})).dnsServerLocalEndPoints | default('')).split(',')) }}
    micolab_dns_post_restart_acl: >-
      {{ (((micolab_dns_post_restart_settings.json | default({})).response | default({})).recursionNetworkACL | default([])
          | micolab_acl_normalize) }}
    micolab_dns_post_restart_reverse_proxies: >-
      {{ (((micolab_dns_post_restart_settings.json | default({})).response | default({})).webServiceReverseProxyAddresses | default([])
          | micolab_acl_normalize) }}
    micolab_dns_post_restart_real_ip_header: >-
      {{ (((micolab_dns_post_restart_settings.json | default({})).response | default({})).webServiceRealIpHeader | default('')) }}

- name: Detect recursion allows for authoritative-only networks after restart
  ansible.builtin.set_fact:
    micolab_dns_post_restart_recursion_deny_conflicts: >-
      {{ micolab_dns_post_restart_acl
         | micolab_acl_deny_conflicts(micolab_dns_authoritative_only_networks) }}

- name: Assert recursion, admin binding, plain DNS, and encrypted protocol state survived restart
  ansible.builtin.assert:
    that:
      - micolab_dns_post_restart_settings.status | default(0) == 200
      - (micolab_dns_post_restart_settings.json | default({})).status | default('') == 'ok'
      - ((micolab_dns_post_restart_settings.json | default({})).response | default({})).recursion | default('') == 'UseSpecifiedNetworkACL'
      - micolab_dns_post_restart_web_addresses | join(',') == micolab_technitium_admin_bind_address
      - micolab_dns_post_restart_reverse_proxies
        == [micolab_dns_admin_reverse_proxy_address | micolab_canonical_cidr]
      - micolab_dns_post_restart_real_ip_header | lower == micolab_dns_admin_real_ip_header | lower
      - micolab_dns_post_restart_recursion_deny_conflicts | length == 0
      - micolab_dns_post_restart_endpoints | join(',') is search('(^|,)0\\.0\\.0\\.0:53(,|$)')
      - (((micolab_dns_post_restart_settings.json | default({})).response | default({}))[item.key] | default(false) | string | lower)
        == (item.value | string | lower)
    fail_msg: >-
      A setting did not survive restart, plain DNS on 0.0.0.0:53 is missing,
      the exact Caddy reverse-proxy trust was not preserved, an
      authoritative-only network is effectively recursive, or the DNS role
      changed an encrypted protocol setting it does not own. Re-running
      technitium_dns must never disable DoT/DoH/DoQ enabled by technitium_tls
      or remove the plain DNS listener. Deny conflicts:
      {{ micolab_dns_post_restart_recursion_deny_conflicts }}.
    quiet: true
  loop: "{{ micolab_dns_encrypted_protocol_state | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: End the post-restart admin session
  ansible.builtin.uri:
    url: "{{ micolab_dns_api_base }}/api/user/logout"
    method: POST
    headers:
      Authorization: "Bearer {{ micolab_dns_post_restart_login.json.token }}"
    status_code: 200
    return_content: true
  register: micolab_dns_post_restart_logout
  failed_when: false
  changed_when: false
  no_log: true
  diff: false

- name: Assert the admin API remains loopback-only
  ansible.builtin.assert:
    that:
      - micolab_technitium_admin_bind_address == '127.0.0.1'
      - micolab_technitium_admin_port == 5380
    fail_msg: >-
      The Technitium admin API must remain on 127.0.0.1:5380. Public admin
      exposure is not supported by this deployment.
    quiet: true

- name: Include local DNS health gates
  ansible.builtin.include_tasks: health.yml

- name: Include remote client acceptance probes
  ansible.builtin.include_tasks: remote_probes.yml

- name: Include resolver switch after all DNS gates
  ansible.builtin.include_tasks: resolver.yml
