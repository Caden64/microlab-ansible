---
- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart Technitium DNS
  ansible.builtin.systemd:
    name: "{{ micolab_technitium_service_name }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
