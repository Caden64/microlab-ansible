---
- name: Validate the two-host boundary without connecting to targets
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Require exactly one infra host isolated from challenge workloads
      ansible.builtin.assert:
        that:
          - groups['microlab_management'] | default([]) | length == 1
          - (groups['microlab_management'] | default([]) | intersect(groups['microlab_challenge'] | default([]))) | length == 0
          - groups['microlab_challenge'] | default([]) | length <= 1
        fail_msg: >-
          Define one infra host in microlab_management for Technitium, step-ca,
          Caddy and Forgejo together. The separate rCTF/microVM host belongs
          only in microlab_challenge (it may be added later). Probe hosts need
          neither group. These playbooks never configure challenge hosts.
        quiet: true

    - name: Reject a challenge alias pointing at the infra address
      ansible.builtin.assert:
        that:
          - (hostvars[item].ansible_host | default(item)) != (hostvars[groups['microlab_management'][0]].ansible_host | default(groups['microlab_management'][0]))
        fail_msg: The rCTF/microVM host must have a different address from infra.
        quiet: true
      loop: "{{ groups['microlab_challenge'] | default([]) }}"

- name: Bootstrap the single infra host
  hosts: microlab_management
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  become: true
  vars:
    microlab_installation_mode: true
  pre_tasks:
    - name: Load inventory-preserving shared defaults
      ansible.builtin.import_tasks: install_defaults.yml

    - name: Enforce workflow mode
      ansible.builtin.assert:
        that:
          - microlab_installation_mode | bool == true
        quiet: true

  tasks:
    - name: "Phase 1: baseline validation, time, storage, packages, firewall"
      ansible.builtin.include_role:
        name: baseline

    - name: Flush baseline handlers before installing services
      ansible.builtin.meta: flush_handlers

    - name: "Phase 2: pinned offline Technitium and runtime installation"
      ansible.builtin.include_role:
        name: technitium_install

    - name: Flush install handlers before DNS convergence
      ansible.builtin.meta: flush_handlers

    - name: "Phase 3: Technitium settings, hnh zone, records, DNS gates"
      ansible.builtin.include_role:
        name: technitium_dns

    - name: Flush DNS handlers before exposing dependent services
      ansible.builtin.meta: flush_handlers

    - name: Gate later phases on the recorded DNS acceptance state
      ansible.builtin.assert:
        that:
          - (microlab_installation_mode | default(false) | bool)
            or (micolab_dns_external_acl_verified | default(false) | bool)
            or (micolab_dns_accept_unverified_external_acl | default(false) | bool)
        fail_msg: >-
          DNS did not reach an accepted state. Refusing to start certificate,
          proxy, or Git services on an unverified resolver/ACL.
        quiet: true

    - name: "Phase 4: internal step-ca issuance and trust distribution"
      ansible.builtin.include_role:
        name: step_ca
      vars:
        microlab_step_ca_trust_store_path: "{{ micolab_trust_bundle_path }}"

    - name: Flush step-ca handlers
      ansible.builtin.meta: flush_handlers

    - name: "Phase 5: Caddy edge with CA+DNS rendered and the Git vhost disabled"
      ansible.builtin.include_role:
        name: caddy
      vars:
        micolab_caddy_enable_git: false
        # Render the dns vhost now so its certificate and Technitium admin
        # proxy are proven before Forgejo. The DoH backend on 8053 is created
        # in phase 6, so the first pass must not probe /dns-query yet.
        micolab_caddy_enable_dns: true
        micolab_caddy_verify_doh: false

    - name: Flush first Caddy pass handlers
      ansible.builtin.meta: flush_handlers

    - name: Record successful credential checkpoint
      ansible.builtin.copy:
        dest: /var/lib/microlab/install-status.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ {'schema': 1, 'phase': 'bootstrap', 'local_ready': false,
              'bootstrap_ready': true, 'external_acceptance': 'pending',
              'git_acceptance': 'pending', 'overall': 'credential-checkpoint',
              'next': 'Store Technitium API token and one-use step-ca enrollment token in protected inventory, then run deploy. No token is printed or generated by this playbook.'} | to_nice_json }}

    - name: Report successful bootstrap checkpoint
      ansible.builtin.debug:
        msg: >-
          Bootstrap ready: baseline, local DNS, CA trust/health and Caddy CA/admin
          health gates passed. Supply the protected API/enrollment credentials
          and run deploy. Full installation, external ACL and Git acceptance
          remain pending. The offline root is never generated by this workflow.
