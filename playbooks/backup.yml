          micolab_backup_dns_dir_effective: "{{ micolab_backup_dns_dir_effective }}"
          micolab_backup_ca_dir_effective: "{{ micolab_backup_ca_dir_effective }}"
      when: micolab_report_effective_interface | default(false) | bool
      tags:
