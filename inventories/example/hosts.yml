---
# Example inventory. Copy this directory, replace every REPLACE_ value, then
# encrypt the vaulted administrator password. Ansible will refuse to converge
# while required values are missing or malformed.
#
# The inventory deliberately uses an IP literal for ansible_host. DNS names are
# not accepted here because bootstrap must not depend on the DNS service that
# this playbook installs.
all:
  children:
    microlab_management:
      hosts:
        microlab-mgmt:
          ansible_host: REPLACE_WITH_MANAGEMENT_IPV4
          ansible_user: REPLACE_WITH_SSH_USER
          # ansible_ssh_private_key_file: /path/on/controller/id_ed25519
          ansible_python_interpreter: /usr/bin/python3
    microlab_challenge:
      # Challenge workloads intentionally do not share the management host.
      hosts: {}
