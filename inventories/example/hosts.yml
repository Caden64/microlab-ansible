---
# Example inventory. Copy this directory, replace every REPLACE_ value, then
# encrypt the vaulted administrator password. Ansible will refuse to converge
# while required values are missing or malformed.
#
# The inventory deliberately uses an IP literal for ansible_host. DNS names are
# not accepted here because bootstrap must not depend on the DNS service that
# this playbook installs.
all:
  children:
    microlab_management:
      hosts:
        microlab-mgmt:
          ansible_host: REPLACE_WITH_MANAGEMENT_IPV4
          ansible_user: REPLACE_WITH_SSH_USER
          # ansible_ssh_private_key_file: /path/on/controller/id_ed25519
          ansible_python_interpreter: /usr/bin/python3
    microlab_challenge:
      # Challenge workloads intentionally do not share the management host.
      hosts:
        microlab-rctf:
          ansible_host: REPLACE_WITH_RCTF_MICROVM_IPV4
          # No management role, firewall or network configuration runs here.
          # Only playbooks/challenges.yml (./microlab challenges deploy) targets
          # this host: it stages Firecracker guest images, the loopback edge
          # proxy and the challenge records. See docs/challenges.md first.
          ansible_user: REPLACE_WITH_RCTF_SSH_USER
          # ansible_ssh_private_key_file: /path/on/controller/id_ed25519
          ansible_python_interpreter: /usr/bin/python3
          # Edge artifact verification expects the pinned linux_amd64 Traefik
          # build; only amd64 is pinned today.
          # micolab_rctf_expected_architecture: amd64
# Challenge deployment inputs (private inventory only, never this example):
#   group_vars/microlab_challenge/challenges-vault.yml (ansible-vault):
#     micolab_rctf_challenges_flags:  # challenge id -> event flag
#   The pinned edge artifact and its generated variables are published by
#   ./microlab challenges artifacts into
#   group_vars/microlab_challenge/zz_microlab_challenges_artifacts.yml.
#   The wildcard record *.fc.rctf.microlab.hnh is owned by technitium_dns
#   (micolab_dns_extra_records in the management inventory).
