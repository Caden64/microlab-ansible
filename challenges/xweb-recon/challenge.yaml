# MicroLab CTF challenge definition. `./microlab challenges deploy --stage register`
# sends `data` to the rCTF admin challenge API (PUT /api/v2/admin/challs/:id).
# Flags are injected from the vault variable `micolab_rctf_challenges_flags`.
# See docs/challenges.md before editing.
#
# Staged record 1 of 2 for the XWEB-500 portal, sharing the same guest image
# as fc-xweb: this entry awards the enumeration stage only (the hidden
# maintenance page). The SQLi/default-creds stage is fc-xweb, a separate
# record with its own flag and points. Each record spawns its own instance
# per team carrying only its own flag; the guest app picks the flag spot
# from the CHALLENGE environment value.
id: fc-xweb-recon
data:
  name: XWEB-500 Recon
  author: microlab
  category: web
  description: |-
    The refrigeration supervisor portal for the site's XWEB-500 controller.
    The commissioning crew left more behind than a factory access code —
    not everything they parked on this portal is still linked from the
    dashboard. Poke around.
  points:
    min: 50
    max: 200
  tags:
    - web
    - recon
    - xweb
  tiebreakEligible: true
  sortWeight: 9
  hidden: true
  releaseTime: null
  instancerConfig:
    instancer: firecracker
    challengeIntegrationId: fc-xweb-recon
    timeoutMilliseconds: 1800000
    extendable: true
    config:
      image: xweb-vuln
      vcpus: 1
      memMiB: 256
      diskMiB: 512
      egress: false
      bootTimeoutSeconds: 60
      readiness: { kind: http, port: 8080, path: /, expectStatus: 200 }
      env:
        CHALLENGE: fc-xweb-recon
    expose:
      - kind: http
        hostPrefix: xweb-recon
        containerName: app
        containerPort: 8080
        shouldDisplay: true
        title: XWEB-500 Portal (recon)
