# MicroLab CTF challenge definition. `./microlab challenges deploy --stage register`
# sends `data` to the rCTF admin challenge API (PUT /api/v2/admin/challs/:id).
# Flags are injected from the vault variable `micolab_rctf_challenges_flags`.
# See docs/challenges.md before editing.
#
# Staged record 1 of 2 for the M364 service-credit portal, sharing the same
# guest image as fc-m364-credit: this entry awards the enumeration stage only
# (the incident notes). The php2shell RCE stage is fc-m364-credit, a separate
# record with its own flag and points. Each record spawns its own instance
# per team carrying only its own flag; the guest app picks the flag spot
# from the CHALLENGE environment value.
id: fc-m364-recon
data:
  name: M364 Outage Recon
  author: microlab
  category: web
  description: |-
    After the big outage, the M364 admin center opened its service-credit
    request form. Before you file a claim, look around the admin center —
    the incident notes from the last outage are still lying around where
    the status page left them.
  points:
    min: 50
    max: 200
  tags:
    - web
    - recon
    - m364
  tiebreakEligible: true
  sortWeight: 19
  hidden: true
  releaseTime: null
  instancerConfig:
    instancer: firecracker
    challengeIntegrationId: fc-m364-recon
    timeoutMilliseconds: 1800000
    extendable: true
    config:
      image: php2shell-vuln
      vcpus: 1
      memMiB: 512
      diskMiB: 1536
      egress: false
      bootTimeoutSeconds: 180
      readiness: { kind: http, port: 8080, path: /, expectStatus: 200 }
      env:
        CHALLENGE: fc-m364-recon
    expose:
      - kind: http
        hostPrefix: m364-recon
        containerName: app
        containerPort: 8080
        shouldDisplay: true
        title: M364 admin center (recon)
